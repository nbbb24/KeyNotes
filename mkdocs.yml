site_name: KeyNotes
site_description: Understand machine learning and the systems that make it work.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "http://127.0.0.1:8000/"]
repo_url: https://github.com/nbbb24/KeyNotes
repo_name: nbbb24/KeyNotes
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_description: 从原理、例子到工程实践，学习机器学习与基础设施。
          nav_translations:
            Home: 首页
            Learning map: 学习路线
            Data movement: 数据搬运
            End-to-end transfer: 端到端传输
            Glossary: 术语表
            Interconnects: 互联与通信
            Memory and addresses: 内存与地址
            Hardware: 硬件层级
            Network planes: 网络平面
            Performance tools: 性能与工具
            Courses: 课程
            Components: 核心组件
            Models: 模型
            Adaptation: 微调与适配
            Alignment and reinforcement learning: 对齐与强化学习
            Inference and systems: 推理与系统
            Multimodal: 多模态
            Speech: 语音
            Tools and protocols: 工具与协议
            Foundations: 基础知识
            Neural-network components: 神经网络组件
            Supervised models: 监督学习模型
            Trees and ensembles: 树与集成学习
            Clustering: 聚类
            Dimensionality reduction: 降维
            Course overview: 课程导读
extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/navigation.css
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

