site_name: KeyNotes
site_description: Understand machine learning and the systems that make it work.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "http://127.0.0.1:8000/"]
repo_url: https://github.com/nbbb24/KeyNotes
repo_name: nbbb24/KeyNotes
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_description: 从原理、例子到工程实践，学习机器学习与基础设施。
