site_name: KeyNotes
site_description: Infra 与 ML 知识笔记。
site_author: Infra Knowledge contributors
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "http://127.0.0.1:8000"]
repo_url: https://github.com/nbbb24/KeyNotes
repo_name: nbbb24/KeyNotes
edit_uri: edit/main/docs/zh/
docs_dir: docs/zh

theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

hooks:
  - scripts/notion_links.py

plugins:
  - search:
      lang: zh

extra_css:
  - infra/assets/stylesheets/extra.css
  - assets/stylesheets/navigation.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

