name: Documentation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/mkdocs.txt
      - run: python -m pip install -r requirements/mkdocs.txt pandas==2.2.3
      - run: mkdocs build --strict
      - run: python scripts/verify_migration.py
      - run: python scripts/verify_examples.py
