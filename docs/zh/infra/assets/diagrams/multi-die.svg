<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 112" role="img" aria-labelledby="title desc">
  <title id="title">多 Die 封装示意</title>
  <desc id="desc">一个封装中包含互联的 Die 0 和 Die 1。</desc>
  <rect x="10" y="8" width="140" height="92" rx="10" fill="#64748b" fill-opacity=".12" stroke="#94a3b8"/>
  <text x="80" y="23" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0d0d0d">封装 Package</text>
  <rect x="19" y="35" width="56" height="55" rx="5" fill="#3b82f6" fill-opacity=".25" stroke="#60a5fa"/>
  <rect x="85" y="35" width="56" height="55" rx="5" fill="#14b8a6" fill-opacity=".25" stroke="#2dd4bf"/>
  <path d="M75 62h10" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="47" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0d0d0d">Die 0</text>
  <text x="113" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0d0d0d">Die 1</text>
