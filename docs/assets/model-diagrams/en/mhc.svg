<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
<title id="title">mHC: four residual streams, one sublayer input</title><desc id="desc">V4 / V4.1 shape view; coefficient scheduling differs between model generations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Segoe UI,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;fill:#20324b} .shape{font-family:Consolas,Microsoft YaHei,monospace}</style>
<rect width="1120" height="580" rx="18" fill="#fff"/>
<text x="36" y="47" font-size="28" text-anchor="start" font-weight="650"><tspan x="36" dy="0">mHC: four residual streams, one sublayer input</tspan></text>
<text x="36" y="79" font-size="16" text-anchor="start" style="fill:#586c84"><tspan x="36" dy="0">V4 / V4.1 shape view; coefficient scheduling differs between model generations.</tspan></text>
<rect x="36" y="135" width="245" height="280" rx="12" fill="#f0f3f8" stroke="#718198" stroke-width="1.5"/>
<text x="52" y="164" font-size="18" text-anchor="start" font-weight="650"><tspan x="52" dy="0">Residual stream</tspan></text>
<text x="52" y="191" font-size="16" text-anchor="start"><tspan x="52" dy="0">[B,S,4,H]</tspan><tspan x="52" dy="23"></tspan><tspan x="52" dy="23">stream 0: [B,S,H]</tspan><tspan x="52" dy="23">stream 1: [B,S,H]</tspan><tspan x="52" dy="23">stream 2: [B,S,H]</tspan><tspan x="52" dy="23">stream 3: [B,S,H]</tspan></text>
<rect x="335" y="135" width="230" height="110" rx="12" fill="#e9f0ff" stroke="#3970ce" stroke-width="1.5"/>
<text x="351" y="164" font-size="18" text-anchor="start" font-weight="650"><tspan x="351" dy="0">pre: weighted collapse</tspan></text>
<text x="351" y="191" font-size="16" text-anchor="start"><tspan x="351" dy="0">4 streams → 1</tspan><tspan x="351" dy="23">[B,S,H]</tspan></text>
<rect x="620" y="135" width="230" height="110" rx="12" fill="#e9f0ff" stroke="#3970ce" stroke-width="1.5"/>
<text x="636" y="164" font-size="18" text-anchor="start" font-weight="650"><tspan x="636" dy="0">Attention / FFN</tspan></text>
<text x="636" y="191" font-size="16" text-anchor="start"><tspan x="636" dy="0">input: [B,S,H]</tspan><tspan x="636" dy="23">output: [B,S,H]</tspan></text>
<rect x="620" y="330" width="230" height="110" rx="12" fill="#e5f6f2" stroke="#20816f" stroke-width="1.5"/>
<text x="636" y="359" font-size="18" text-anchor="start" font-weight="650"><tspan x="636" dy="0">post + 4×4 mixing</tspan></text>
<text x="636" y="386" font-size="16" text-anchor="start"><tspan x="636" dy="0">[B,S,H] → [B,S,4,H]</tspan></text>
<rect x="900" y="330" width="184" height="110" rx="12" fill="#e5f6f2" stroke="#20816f" stroke-width="1.5"/>
<text x="916" y="359" font-size="18" text-anchor="start" font-weight="650"><tspan x="916" dy="0">Next sublayer</tspan></text>
<text x="916" y="386" font-size="16" text-anchor="start"><tspan x="916" dy="0">[B,S,4,H]</tspan></text>
<polyline points="281,190 335,190" fill="none" stroke="#3970ce" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="565,190 620,190" fill="none" stroke="#3970ce" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="735,245 735,330" fill="none" stroke="#3970ce" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="281,385 620,385" fill="none" stroke="#718198" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="850,385 900,385" fill="none" stroke="#20816f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="36" y="539" font-size="15" text-anchor="start" style="fill:#586c84"><tspan x="36" dy="0">H: Flash=4096, Pro=7168, V4.1=5120. Expert input width remains H, not 4H.</tspan></text>
</svg>
