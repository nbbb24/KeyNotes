<text x="52" y="191" font-size="16" text-anchor="start"><tspan x="52" dy="0">concat: [B,S,15360]</tspan><tspan x="52" dy="23">main_proj: 15360 → 5120</tspan></text>
<rect x="36" y="335" width="260" height="110" rx="12" fill="#e9f0ff" stroke="#3970ce" stroke-width="1.5"/>
<text x="52" y="364" font-size="18" text-anchor="start" font-weight="650"><tspan x="52" dy="0">草稿块 Embedding</tspan></text>
