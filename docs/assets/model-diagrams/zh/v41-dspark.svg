<text x="386" y="391" font-size="16" text-anchor="start"><tspan x="386" dy="0">128 experts · top-3</tspan><tspan x="386" dy="23">读取 main_x 上下文</tspan></text>
<rect x="714" y="335" width="370" height="110" rx="12" fill="#e5f6f2" stroke="#20816f" stroke-width="1.5"/>
<text x="730" y="364" font-size="18" text-anchor="start" font-weight="650"><tspan x="730" dy="0">草稿词表头 → 主干验证</tspan></text>
<text x="730" y="391" font-size="16" text-anchor="start"><tspan x="730" dy="0">logits: [B,5,129280]</tspan><tspan x="730" dy="23">接受前缀由验证结果决定</tspan></text>
