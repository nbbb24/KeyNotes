<text x="306" y="144" font-size="18" text-anchor="start" font-weight="650"><tspan x="306" dy="0">同一组主 KV + Indexer Key</tspan></text>
<text x="306" y="171" font-size="16" text-anchor="start"><tspan x="306" dy="0">[B,floor(T/2),512] + 128-d K</tspan></text>
<rect x="705" y="115" width="379" height="91" rx="12" fill="#fff3d9" stroke="#bc7b12" stroke-width="1.5"/>
