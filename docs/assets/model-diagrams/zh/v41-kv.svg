<rect x="36" y="603" width="1048" height="45" rx="12" fill="#f0f3f8" stroke="#718198" stroke-width="1.5"/>
<text x="52" y="632" font-size="18" text-anchor="start" font-weight="650"><tspan x="52" dy="0">层 0–1：仅 SWA；层 20 来源于 Encoder 输出；24/28/32/36 重新选择位置，但不新建全局 KV。</tspan></text>
