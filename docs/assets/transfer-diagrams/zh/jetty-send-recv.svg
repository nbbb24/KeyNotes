<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
<title id="title">URMA 双边传输：A 的 JFS 到 B 的 JFR</title><desc id="desc">以 4 KiB SEND 为例；资源预先创建，ID 为示意值；普通单边 WRITE 不沿用接收流程。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Segoe UI,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;fill:#20324b} .shape{font-family:Consolas,Microsoft YaHei,monospace}</style>
<rect width="1120" height="820" rx="18" fill="#fff"/>
<text x="36" y="47" font-size="28" text-anchor="start" font-weight="650"><tspan x="36" dy="0">URMA 双边传输：A 的 JFS 到 B 的 JFR</tspan></text>
<text x="36" y="79" font-size="16" text-anchor="start" style="fill:#586c84"><tspan x="36" dy="0">以 4 KiB SEND 为例；资源预先创建，ID 为示意值；普通单边 WRITE 不沿用接收流程。</tspan></text>
<rect x="36" y="117" width="440" height="141" rx="12" fill="#e9f0ff" stroke="#3970ce" stroke-width="1.5"/>
<text x="52" y="146" font-size="18" text-anchor="start" font-weight="650"><tspan x="52" dy="0">A：Jetty / 发送侧 JFS</tspan></text>
<text x="52" y="173" font-size="16" text-anchor="start"><tspan x="52" dy="0">local ID = 17; user_ctx = 42</tspan><tspan x="52" dy="23">发送 WR：SEND、src、长度、对端句柄</tspan><tspan x="52" dy="23">provider 编码 SQ 中的 WQE</tspan></text>
<rect x="644" y="117" width="440" height="141" rx="12" fill="#e9f0ff" stroke="#3970ce" stroke-width="1.5"/>
<text x="660" y="146" font-size="18" text-anchor="start" font-weight="650"><tspan x="660" dy="0">B：Jetty / 接收侧 JFR</tspan></text>
<text x="660" y="173" font-size="16" text-anchor="start"><tspan x="660" dy="0">local ID = 29; user_ctx = 900</tspan><tspan x="660" dy="23">先贴接收 WR：dst、容量、注册段</tspan><tspan x="660" dy="23">provider 发布 RQ 中的接收描述</tspan></text>
<polyline points="476,185 644,185" fill="none" stroke="#3970ce" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="560" y="166" font-size="15" text-anchor="middle"><tspan x="560" dy="0">导入的对端</tspan></text>
<rect x="36" y="312" width="440" height="103" rx="12" fill="#e5f6f2" stroke="#20816f" stroke-width="1.5"/>
<text x="52" y="341" font-size="18" text-anchor="start" font-weight="650"><tspan x="52" dy="0">源载荷：src / 4096 字节</tspan></text>
<text x="52" y="368" font-size="16" text-anchor="start"><tspan x="52" dy="0">生产完成后，硬件读取源内容</tspan><tspan x="52" dy="23">WQE 不是这 4096 字节本身</tspan></text>
<rect x="644" y="312" width="440" height="103" rx="12" fill="#e5f6f2" stroke="#20816f" stroke-width="1.5"/>
<text x="660" y="341" font-size="18" text-anchor="start" font-weight="650"><tspan x="660" dy="0">目标载荷：B 已贴的 dst</tspan></text>
<text x="660" y="368" font-size="16" text-anchor="start"><tspan x="660" dy="0">硬件按接收描述放置数据</tspan><tspan x="660" dy="23">SEND 不通过远端 dst 指针选缓冲区</tspan></text>
<polyline points="256,258 256,312" fill="none" stroke="#3970ce" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="864,258 864,312" fill="none" stroke="#3970ce" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="476,363 644,363" fill="none" stroke="#20816f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="560" y="344" font-size="15" text-anchor="middle"><tspan x="560" dy="0">UB 传输</tspan></text>
<rect x="36" y="471" width="440" height="125" rx="12" fill="#fff3d9" stroke="#bc7b12" stroke-width="1.5"/>
<text x="52" y="500" font-size="18" text-anchor="start" font-weight="650"><tspan x="52" dy="0">A：关联 JFC / CQ（例 ID=3）</tspan></text>
<text x="52" y="527" font-size="16" text-anchor="start"><tspan x="52" dy="0">按完成策略，硬件写发送 CQE</tspan><tspan x="52" dy="23">poll_jfc → CR: status, user_ctx=42</tspan><tspan x="52" dy="23">检查成功后，按语义复用源</tspan></text>
<rect x="644" y="471" width="440" height="125" rx="12" fill="#fff3d9" stroke="#bc7b12" stroke-width="1.5"/>
<text x="660" y="500" font-size="18" text-anchor="start" font-weight="650"><tspan x="660" dy="0">B：关联 JFC / CQ（例 ID=8）</tspan></text>
<text x="660" y="527" font-size="16" text-anchor="start"><tspan x="660" dy="0">硬件写接收 CQE；不是放入整个任务</tspan><tspan x="660" dy="23">poll_jfc → CR: status, user_ctx=900</tspan><tspan x="660" dy="23">校验长度 / 批次，再满足设备可见性</tspan></text>
<polyline points="256,415 256,471" fill="none" stroke="#20816f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="864,415 864,471" fill="none" stroke="#20816f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="36" y="650" width="1048" height="94" rx="12" fill="#f0f3f8" stroke="#718198" stroke-width="1.5"/>
<text x="52" y="679" font-size="18" text-anchor="start" font-weight="650"><tspan x="52" dy="0">上层同步与资源交接</tspan></text>
<text x="52" y="706" font-size="16" text-anchor="start"><tspan x="52" dy="0">A 本地发送完成、B 接收完成、Stream 等待返回、B 消费结束，是不同的证据。</tspan><tspan x="52" dy="23">B 消费后归还目标槽位；两侧的 user_ctx 来自各自 WR，不自动跨端复制。</tspan></text>
<text x="36" y="779" font-size="15" text-anchor="start" style="fill:#586c84"><tspan x="36" dy="0">Jetty 可组合发送与接收资源；也可用独立 JFS / JFR。共享 JFC 时必须按请求身份分派 CR。</tspan></text>
</svg>
